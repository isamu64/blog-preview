<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <div class="card-container">
      <div class="card">
        <img
          src="sources/blog-preview-main/assets/images/illustration-article.svg"
          alt="image logo"
          class="logo"
        />
        <p class="category">Learning</p>
        <p class="published">Published 21 DEC 2023</p>

        <h1>HTML & CSS foundations</h1>
        <p class="description">
          These languages are the backbone of every website, defining structure,
          content, and presentation.
        </p>
        <div class="author">
          <img
            src="sources/blog-preview-main/assets/images/image-avatar.webp"
            alt="image de Greg Hooper"
            class="image-author"
          />
          <p class="name-author">Greg Hooper</p>
        </div>
      </div>
    </div>

    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by
      <a href="https://www.frontendmentor.io/profile/isamu64"
        >Frédéric Soguéro</a
      >.
    </footer>
  </body>
</html>
